version: '3.8'
services:
  api:
    build: ./backend
    container_name: foodics-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=foodics-clone-super-secret-key-change-in-production-2024
      - JWT_EXPIRES_IN=7d
      - PORT=4000
      - NODE_ENV=production
      - TAX_RATE=0.15
      - CURRENCY=SAR
    volumes:
      - foodics-data:/app/data
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: foodics-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://api:4000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  foodics-data:
